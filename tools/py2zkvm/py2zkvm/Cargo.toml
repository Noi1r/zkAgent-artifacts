[package]
name = "py2zkvm"
version = "0.1.0"
edition = "2021"
description = "Python to SP1 zkVM transpiler - converts Python scripts to provable SP1 programs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
syn = { version = "2.0", features = ["full", "parsing"] }
quote = "1.0"
proc-macro2 = "1.0"
prettyplease = "0.2"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
walkdir = "2.4"
tempfile = "3.10"

[[bin]]
name = "py2zkvm"
path = "src/main.rs"
